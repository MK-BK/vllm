name: transfer-wheel
on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: "wheel download URL"
        required: true
      wheel_file:
        description: "wheel filename"
        required: true
      tag:
        description: "destination image tag"
        required: true

env:
  REGISTRY: crpi-pweus896l7j9p1b9.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: images_dev
  IMAGE_NAME: wheel-transfer

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download wheel
        run: |
          mkdir -p transfer
          curl -sSL --retry 5 -o "transfer/${{ inputs.wheel_file }}" "${{ inputs.wheel_url }}"
          ls -la transfer/
          sha256sum "transfer/${{ inputs.wheel_file }}"
          echo "FROM alpine:3" > transfer/Dockerfile
          echo "COPY ${{ inputs.wheel_file }} /wheel/" >> transfer/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: MK-BK
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./transfer
          push: true
          tags: ghcr.io/mk-bk/wheel-transfer:${{ inputs.tag }}
          provenance: false

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push to Aliyun ACR
        uses: docker/build-push-action@v6
        with:
          context: ./transfer
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          provenance: false
