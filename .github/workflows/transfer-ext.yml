name: transfer-ext-src
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone external sources
        run: |
          set -e
          mkdir -p ext

          clone_hash() {
            local name=$1 url=$2 hash=$3
            git init -q ext/$name
            cd ext/$name
            git remote add origin "$url"
            git fetch -q --depth 1 origin "$hash"
            git checkout -q FETCH_HEAD
            git submodule update -q --init --recursive --depth 1 || git submodule update --init --recursive
            cd ../..
          }

          git clone -q --depth 1 --branch v4.7.1 --recurse-submodules --shallow-submodules https://github.com/nvidia/cutlass.git ext/cutlass
          clone_hash deepgemm https://github.com/deepseek-ai/DeepGEMM.git e1f418c2a4f20818221f6b0e578b4c2f634d4c3f
          clone_hash flashkda https://github.com/vllm-project/FlashKDA.git b59532f1f464fbd536272780e30df5bf6a2ccc02
          clone_hash flashmla https://github.com/vllm-project/FlashMLA 0eee43b12f034b657133cf2afca6a72ebb6efccf
          clone_hash fmha_sm100 https://github.com/vllm-project/MSA.git f355c37eb4e1413f21ee2ad8bbad25079e6bef9d
          clone_hash qutlass https://github.com/IST-DASLab/qutlass.git e74319e3405ce6d71965732880f5dc1f52371f64
          clone_hash tml_fa4 https://github.com/vllm-project/tml-fa4.git 75765e76a9c2c012c1f6ecd64577eb646eb4d303
          clone_hash flash_attn https://github.com/vllm-project/flash-attention.git 506341a143fcabd4bb79052a7605ada727d6b3f5
          git clone -q --depth 1 --branch v3.5.1 --recurse-submodules --shallow-submodules https://github.com/triton-lang/triton.git ext/triton
          du -sh ext/*
          echo "FROM alpine:3" > Dockerfile
          echo "COPY ext /ext/" >> Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: MK-BK
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mk-bk/ext-src:v30
          provenance: false
